
[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
gcode:
    BED_MESH_CLEAR
    G0 Z{printer["gcode_macro _CALIBRATION_SWITCH"].z} F10000
    G0 X{printer["gcode_macro _CALIBRATION_SWITCH"].x} Y{printer["gcode_macro _CALIBRATION_SWITCH"].y} F10000

[gcode_macro CALIBRATE_ALL_OFFSETS]
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}
    # Tool 0
    SELECT_TOOL T={tools[0]}  RESTORE_AXIS=XYZ
    STOP_CRASH_DETECTION
    CALIBRATE_MOVE_OVER_PROBE    
    M104 S150
    TEMPERATURE_WAIT SENSOR='{printer.toolhead.extruder}' MINIMUM=150
    TOOL_LOCATE_SENSOR
    M104 S0
    {% for tool in tools[1:] %}
        SELECT_TOOL T={tool}  RESTORE_AXIS=Z
        STOP_CRASH_DETECTION
        M104 S150 T{tool}
        CALIBRATE_MOVE_OVER_PROBE
        TEMPERATURE_WAIT SENSOR='{printer[names[loop.index]].extruder}' MINIMUM=150
        TOOL_CALIBRATE_TOOL_OFFSET
        _SAVE_TOOL_OFFSET T={tool}
        M104 S0
    {% endfor %}
    
    # Finish up
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
    TURN_OFF_HEATERS

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
gcode:    
    CALIBRATE_MOVE_OVER_PROBE
    M109 S150    
    TOOL_LOCATE_SENSOR
    TOOL_CALIBRATE_PROBE_OFFSET
    M104 S0


[gcode_macro DIAGNOSE_TOOL_OFFSET_PRECISION]
description: Repeats a tool offset measurement at several LOWER_Z heights to tell measurement
   noise apart from a real height-dependent bias. Position the tool over the probe and heat it
   first (see the setup steps inside CALIBRATE_ALL_OFFSETS). Pass BASELINE=1 for tool 0 (uses
   TOOL_LOCATE_SENSOR); omit it for any other tool (uses TOOL_CALIBRATE_TOOL_OFFSET, which
   requires TOOL_LOCATE_SENSOR to have already been run for tool 0 in this session).
   HEIGHTS defaults to "0.1,0.3,0.6,1.0", REPEATS defaults to 5.
gcode:
    {% set heights = (params.HEIGHTS|default("0.1,0.3,0.6,1.0"))|string %}
    {% set repeats = (params.REPEATS|default(5))|int %}
    {% set baseline = (params.BASELINE|default(0))|int %}
    {% for h_str in heights.split(',') %}
        {% set h = h_str|trim|float %}
        {% set ns = namespace(xs=[], ys=[], zs=[]) %}
        {% for i in range(repeats) %}
            {% if baseline %}
                TOOL_LOCATE_SENSOR LOWER_Z={h}
            {% else %}
                TOOL_CALIBRATE_TOOL_OFFSET LOWER_Z={h}
            {% endif %}
            {% set ns.xs = ns.xs + [printer.tools_calibrate.last_x_result] %}
            {% set ns.ys = ns.ys + [printer.tools_calibrate.last_y_result] %}
            {% set ns.zs = ns.zs + [printer.tools_calibrate.last_z_result] %}
        {% endfor %}
        {% set xs = ns.xs|sort %}
        {% set ys = ns.ys|sort %}
        {% set zs = ns.zs|sort %}
        RESPOND MSG="LOWER_Z={h}: X min={xs[0]|round(4)} max={xs[-1]|round(4)} spread={(xs[-1]-xs[0])|round(4)}"
        RESPOND MSG="LOWER_Z={h}: Y min={ys[0]|round(4)} max={ys[-1]|round(4)} spread={(ys[-1]-ys[0])|round(4)}"
        RESPOND MSG="LOWER_Z={h}: Z min={zs[0]|round(4)} max={zs[-1]|round(4)} spread={(zs[-1]-zs[0])|round(4)}"
    {% endfor %}

[gcode_macro _SAVE_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset VALUE="{printer.tools_calibrate.last_x_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset VALUE="{printer.tools_calibrate.last_y_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_z_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset

[gcode_macro _SAVE_Z_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_z_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset
