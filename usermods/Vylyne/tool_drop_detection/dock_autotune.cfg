# Requires dock_autotune.py to be symlinked into klippy/extras/
# alongside tool_drop_detection.py.
#
# Commands: TC_DOCK_AUTOTUNE / TC_DOCK_AUTOTUNE_CANCEL
[dock_autotune]
range_mm:      1.0     # +/- search window, mm
step_mm:       0.1     # mm increment
pitch_tol:     45      # deg, vs baseline
roll_tol:      45
threshold:     0.1     # 10% peak increase considered "worse"
changes_per:   5       # dock/undock cycles averaged per candidate position
abort_on_g:    15

# A tilt-guard trip is auto-rechecked (see guard_recheck_* below) only when
# the toolchanger's own presence sensor confirms the tool is seated -- that
# rules out a real drop before trusting a possibly-transient accelerometer
# reading. A high-g trip is never auto-rechecked, since a trustworthy
# recheck needs a full redock, not just a reread; use Retry for that.
guard_recheck_count: 2       # extra rereads before trusting a tilt trip
guard_recheck_delay: 0.3     # seconds between rereads

#toolchanger:    toolchanger  # name of the [toolchanger] section to drive
#poll_freq:      5            # Hz, accelerometer polling frequency during the run
#poll_rate:      1600         # Hz, accelerometer BW_RATE during the run
#baseline_settle: 1.0         # seconds to let the undocked shuttle settle before reading its baseline tilt
#measure_settle:  0.25        # seconds to let each pickup settle before reading its peak
#debug:          False
