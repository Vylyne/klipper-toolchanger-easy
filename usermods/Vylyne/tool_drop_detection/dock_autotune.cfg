# Requires dock_autotune.py to be symlinked into klippy/extras/
# alongside tool_drop_detection.py.
#
# Commands: TC_DOCK_AUTOTUNE / TC_DOCK_AUTOTUNE_CANCEL
[dock_autotune]
range_mm:      1.0     # +/- search window, mm
step_mm:       0.1     # mm increment
pitch_tol:     45      # deg, vs baseline
roll_tol:      45
threshold:     0.1     # 10% peak increase considered "worse"
changes_per:   5       # dock/undock cycles averaged per candidate position
abort_on_g:    15

# A tilt trip gets a quick, cheap settle-reread first (no redock) -- see
# guard_recheck_* -- but only when the toolchanger's own presence sensor
# confirms the tool is seated, since that's what rules out a real drop
# before trusting a possibly-transient accelerometer reading.
guard_recheck_count: 2       # extra rereads before trusting a tilt trip
guard_recheck_delay: 0.3     # seconds between rereads

# If a trip (tilt or high-g) survives that, the whole candidate is
# re-measured from scratch (a real undock/redock, not just a reread) up to
# this many more times -- any clean attempt is treated as the real reading
# and the earlier trip(s) as a one-off. If EVERY attempt trips and the tool
# is still corroborated present, the run assumes this candidate is simply
# past the edge of what's mechanically viable, silently backs off to the
# best position found so far, and moves on to the next direction/axis --
# no prompt. Only an uncorroborated trip (or one during the pre-scan
# baseline, before there's a direction to back off from) still pauses for
# Retry/Abort.
confirm_retries: 2

#toolchanger:    toolchanger  # name of the [toolchanger] section to drive
#poll_freq:      5            # Hz, accelerometer polling frequency during the run
#poll_rate:      1600         # Hz, accelerometer BW_RATE during the run
#baseline_settle: 1.0         # seconds to let the undocked shuttle settle before reading its baseline tilt
#measure_settle:  0.25        # seconds to let each pickup settle before reading its peak
#debug:          False
